<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Soccer · Four Leagues, One Model</title>
<style>
:root{--bg:#0d1117;--card:#151b23;--card2:#111820;--line:#232b36;--txt:#dbe4ee;--dim:#8b98a9;
--acc:#e8b44a;--acc2:#4ad6a2;--red:#e06c75;font-size:15px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);
font:400 1rem/1.5 system-ui,Segoe UI,Roboto,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:22px 16px 60px}
h1{font-size:1.25rem;letter-spacing:.14em;margin:0}
h1 b{color:var(--acc)}
.tag{color:var(--dim);font-size:.8rem;letter-spacing:.1em;text-transform:uppercase}
#meta{color:var(--dim);font-size:.8rem;margin-top:4px}
nav{display:flex;gap:6px;margin:18px 0 14px;flex-wrap:wrap}
nav button{background:none;border:1px solid var(--line);color:var(--dim);
padding:7px 14px;border-radius:8px;cursor:pointer;font:inherit;font-size:.85rem;letter-spacing:.06em}
nav button.on{background:var(--card);color:var(--txt);border-color:#33404f}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px}
h3{margin:0 0 6px;font-size:1rem;letter-spacing:.08em;text-transform:uppercase;color:var(--acc)}
.sub{color:var(--dim);font-size:.82rem;margin-bottom:10px}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th{color:var(--dim);text-align:left;font-weight:500;font-size:.74rem;letter-spacing:.1em;
text-transform:uppercase;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.num{text-align:right}.dim{color:var(--dim)}
.pill{display:inline-block;background:#1d2632;border:1px solid var(--line);border-radius:20px;
padding:1px 9px;font-size:.72rem;color:var(--dim);white-space:nowrap}
.bar{height:7px;border-radius:4px;background:#22303f;min-width:64px;position:relative;overflow:hidden;display:inline-block;width:100%}
.bar i{position:absolute;inset:0;background:var(--acc2);border-radius:4px}
.trip{display:flex;gap:2px;height:9px;border-radius:4px;overflow:hidden;min-width:110px}
.trip i{display:block}
.empty{color:var(--dim);padding:18px;text-align:center}
.hide-m{display:table-cell}@media(max-width:680px){.hide-m{display:none}}
/* --- PHONE. This is where the tool actually gets read, and every one of these
   three rules is fixing a measured overflow at 390px, not a hypothetical one:
   the backtest .pill ran 660px wide because it is `white-space:nowrap` and the
   sentence is long; the Builder's fixture <select> ran 403px because a long
   option name sets a select's intrinsic width; and the wide tables ran to 475px.
   A page you have to pan sideways to read is a page you stop opening. --- */
@media(max-width:680px){
  /* the pill is a sentence on a phone, not a chip -- let it wrap and drop the
     rounded-chip shape it can no longer honour */
  .pill{white-space:normal;display:block;border-radius:8px;padding:6px 10px;line-height:1.5}
  /* a select cannot shrink below its widest option unless told it may */
  select{max-width:100%;min-width:0}
  .ctl{width:100%}
  /* last resort for the genuinely wide tables: scroll the TABLE, not the PAGE,
     so the nav and the verdict banner stay put while a grid is panned */
  .scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
  /* :not(.grid) matters — the Lab's correct-score map is already narrow enough
     to fit, and forcing 460px on it pushed the page 105px wide at 390. Only the
     column-heavy data tables need the floor. */
  .scrollx table:not(.grid){min-width:460px}
  .scrollx .grid{min-width:0}
}
footer{color:var(--dim);font-size:.72rem;text-align:center;margin-top:26px}
/* --- controls. The MLB board shipped for months with filter buttons that had no
   CSS rule at all: the class toggled correctly and nothing changed on screen.
   Every interactive control here gets an explicit on-state before it ships. --- */
.btn{background:var(--card2);border:1px solid var(--line);color:var(--dim);font:inherit;
font-size:.78rem;font-weight:600;padding:5px 12px;border-radius:20px;cursor:pointer}
.btn:hover{color:var(--txt);border-color:#3d4a5a}
.btn.on{background:var(--acc2);border-color:var(--acc2);color:#08120d}
.ctl{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin:10px 0}
select,input{background:var(--card2);border:1px solid var(--line);color:var(--txt);
font:inherit;font-size:.85rem;padding:5px 9px;border-radius:8px}
.grid{border-collapse:collapse;font-size:.72rem;margin-top:8px}
.grid td,.grid th{padding:4px 6px;border:1px solid var(--line);text-align:center;min-width:38px}
.verdict{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 12px;font-size:.84rem;line-height:1.55}
.verdict.bad{border-color:var(--red)}
.legrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:7px 0;border-bottom:1px solid var(--line)}
.x{background:none;border:none;color:var(--red);cursor:pointer;font-size:1rem;padding:0 4px}
.big{font-size:1.5rem;font-weight:700}
</style></head><body><div class="wrap">
<div class="tag">SoccerTool</div>
<h1>SOCCER <b>FOUR LEAGUES · ONE MODEL</b></h1>
<div class="tag">time-decayed dixon-coles · measured vs closing market · graded live</div>
<div id="meta">loading slate.json…</div>
<nav id="nav"></nav>
<div id="tabs"></div>
<footer>decision support, not advice · data: football-data.co.uk · model graded against its own record</footer>
</div>
<script>
const $=id=>document.getElementById(id);
const LG_ORDER=["E0","SP1","D1","F1"];
const pct=x=>Math.round(100*Number(x));
const pc1=x=>(100*Number(x)).toFixed(1);
const trip=(h,d,a)=>`<span class="trip" title="H ${pct(h)} · D ${pct(d)} · A ${pct(a)}">
<i style="width:${pct(h)}%;background:var(--acc2)"></i>
<i style="width:${pct(d)}%;background:#5b6b7d"></i>
<i style="width:${pct(a)}%;background:var(--red)"></i></span>`;
const bar=p=>`<div class="bar"><i style="width:${Math.min(Math.max(p,0),100)}%"></i></div>`;
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let D=null;   // the whole slate, kept for the interactive tabs

/* ============================================================================
   THE ENGINE
   ----------------------------------------------------------------------------
   This is a line-for-line port of soccer_model.score_grid / match_probs. It is
   the reason the publisher now emits `lh`, `la` and `mu`: every market below --
   any total line, any correct score, clean sheets, win-to-nil, team totals,
   handicaps, and the same-game correlation in the Builder -- is the SAME 9x9
   matrix summed over a different region. Publishing only the five pre-chosen
   aggregates (pH/pD/pA/o25/btts) meant a Python change and a redeploy for every
   new question. Publishing the two Poisson rates moves all of it into the
   browser, exactly, with no second model to keep in sync.

   Correctness note: this must stay numerically identical to the Python. Same
   kmax (8 -> 9x9), same tau, same renormalisation, same order of operations.
   A JS engine that quietly disagrees with the grader is worse than no engine,
   because the graded record would then be measuring something the screen never
   showed.
   ========================================================================== */
const KMAX=8;
function poisPMF(l,k){ let p=Math.exp(-l); for(let i=1;i<=k;i++) p*=l/i; return p; }
function tau(x,y,lh,la,rho){
  if(x===0&&y===0) return 1-lh*la*rho;
  if(x===0&&y===1) return 1+lh*rho;
  if(x===1&&y===0) return 1+la*rho;
  if(x===1&&y===1) return 1-rho;
  return 1;
}
function scoreGrid(lh,la,rho){
  const ph=[],pa=[];
  for(let i=0;i<=KMAX;i++){ ph.push(poisPMF(lh,i)); pa.push(poisPMF(la,i)); }
  const g=[]; let s=0;
  for(let i=0;i<=KMAX;i++){ g[i]=[];
    for(let j=0;j<=KMAX;j++){
      let v=ph[i]*pa[j];
      if(i<2&&j<2) v*=Math.max(tau(i,j,lh,la,rho),1e-9);
      g[i][j]=v; s+=v; } }
  for(let i=0;i<=KMAX;i++) for(let j=0;j<=KMAX;j++) g[i][j]/=s;
  return g;
}
// Sum the grid over an arbitrary predicate. Every market on this page is one call.
function gsum(g,f){ let s=0; for(let i=0;i<=KMAX;i++) for(let j=0;j<=KMAX;j++) if(f(i,j)) s+=g[i][j]; return s; }

/* MARKET CATALOGUE.
   Each entry is {key, label, p}. Deliberately weighted toward the high-
   probability end -- double chance, over 0.5, under 4.5, team totals -- because
   the board is ranked by what hits, and those are the rows that survive a
   -350 floor. The long-shot markets (correct score, big handicaps) live in the
   Lab, where you go looking for them, rather than on a board you scan. */
function marketsFor(g){
  const M=[];
  const add=(key,label,p)=>{ if(p>1e-6&&p<1-1e-9) M.push({key,label,p}); };
  const pH=gsum(g,(i,j)=>i>j), pD=gsum(g,(i,j)=>i===j), pA=gsum(g,(i,j)=>i<j);
  add('H','home win',pH); add('D','draw',pD); add('A','away win',pA);
  add('1X','home or draw',pH+pD); add('X2','draw or away',pD+pA); add('12','either team wins',pH+pA);
  [0.5,1.5,2.5,3.5,4.5].forEach(l=>{
    add('O'+l,'over '+l+' goals',gsum(g,(i,j)=>i+j>l));
    add('U'+l,'under '+l+' goals',gsum(g,(i,j)=>i+j<l));
  });
  add('BY','both teams score',gsum(g,(i,j)=>i>0&&j>0));
  add('BN','not both score',gsum(g,(i,j)=>i===0||j===0));
  [0.5,1.5,2.5].forEach(l=>{
    add('HO'+l,'home over '+l,gsum(g,i=>i>l));
    add('HU'+l,'home under '+l,gsum(g,i=>i<l));
    add('AO'+l,'away over '+l,gsum(g,(i,j)=>j>l));
    add('AU'+l,'away under '+l,gsum(g,(i,j)=>j<l));
  });
  add('CSH','home clean sheet',gsum(g,(i,j)=>j===0));
  add('CSA','away clean sheet',gsum(g,i=>i===0));
  add('WNH','home wins to nil',gsum(g,(i,j)=>i>j&&j===0));
  add('WNA','away wins to nil',gsum(g,(i,j)=>j>i&&i===0));
  add('H-1.5','home by 2+',gsum(g,(i,j)=>i-j>=2));
  add('A-1.5','away by 2+',gsum(g,(i,j)=>j-i>=2));
  add('H+1.5','home +1.5 (lose by 1 or better)',gsum(g,(i,j)=>i-j>-2));
  add('A+1.5','away +1.5 (lose by 1 or better)',gsum(g,(i,j)=>j-i>-2));
  return M;
}
// A model probability written as a price. It is p in odds form and nothing
// more -- it is NOT a claim the book is wrong.
function amFromP(p){
  if(!(p>0&&p<1)) return '—';
  const d=1/p, a = d>=2 ? Math.round((d-1)*100) : -Math.round(100/(d-1));
  return (a>0?'+':'')+a;
}
const pFromAm=a=>a>0?100/(a+100):(-a)/((-a)+100);

/* Rates for ANY pair of teams in a league -- the thing `mu` unlocked. Before it
   was published the browser could read a rating table but could not turn two
   ratings into a match, which is the entire job of a matchup lab. */
function lamFor(L,home,away,neutral){
  // If this exact pairing is already a scheduled fixture, use the rates the
  // PUBLISHER computed rather than reconstructing them. Both paths are the same
  // formula, but att/dfn/home_adv reach the browser rounded to 3dp while lh/la
  // arrive at 6dp, so reconstruction drifts by ~0.1% — small, but it would make
  // the Lab and the fixture table print two different numbers for the same
  // match, and a tool that disagrees with itself is not trusted about anything
  // else. Exact when we can be, reconstructed only when we must be.
  if(!neutral){
    const f=(L.fixtures||[]).find(x=>x.home===home&&x.away===away&&x.lh!=null);
    if(f) return {lh:f.lh, la:f.la, exact:true};
  }
  const R={}; (L.ratings||[]).forEach(r=>R[r.team]=r);
  const h=R[home], a=R[away];
  if(!h||!a||L.mu==null) return null;
  const ha=neutral?0:(L.home_adv||0);
  return {lh:Math.exp(L.mu+ha+h.att-a.dfn), la:Math.exp(L.mu+a.att-h.dfn), exact:false};
}
// Until the first build carrying `mu` lands, the Lab has no league baseline. It
// says so and refuses to draw rather than inventing one: a plausible-looking
// number with no fitted parameter behind it is the worst of the three options.
const hasMu=L=>L&&L.mu!=null;

/* WIDE TABLES ON A PHONE.
   Measured at 390px: the league tabs overflowed the viewport by ~290px and the
   Method backtest by 120px, so reading a rating meant panning the whole page
   sideways -- nav, verdict banner and all. Every table gets a scroll container
   so the TABLE pans and the page does not.

   This is a MutationObserver rather than a call at the end of each render for
   one reason: there are eight places that emit a <table>, several of them
   re-render on interaction (filters, the Lab's team pickers, the slip), and any
   scheme that requires remembering to call a helper will be wrong the first
   time somebody adds a ninth. The observer cannot be forgotten. Wrapping marks
   the table, so the mutation it causes finds nothing to do and the loop dies. */
function wrapWide(root){
  (root||document).querySelectorAll('#tabs table:not([data-sx])').forEach(t=>{
    t.setAttribute('data-sx','1');
    if(t.parentElement && t.parentElement.classList.contains('scrollx')) return;
    const d=document.createElement('div'); d.className='scrollx';
    t.parentNode.insertBefore(d,t); d.appendChild(t);
  });
}

function toCSV(header,rows){
  const q=v=>{const s=String(v==null?'':v); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
  return [header.map(q).join(',')].concat(rows.map(r=>r.map(q).join(','))).join('\n');
}
function downloadCSV(name,header,rows){
  const b=new Blob([toCSV(header,rows)],{type:'text/csv'}), u=URL.createObjectURL(b);
  const a=document.createElement('a'); a.href=u; a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(u),1000);
}

/* ============================================================================
   RENDER
   ========================================================================== */
function render(d){
  D=d;
  var _meta=`updated ${new Date(d.generated).toLocaleString()}`;
  // FRESHNESS: if every priced fixture is already in the past, the build has stalled —
  // warn instead of showing a frozen slate as current.
  var _end=d.slate_end||'';
  var _n=new Date();
  var _t=_n.getFullYear()+'-'+String(_n.getMonth()+1).padStart(2,'0')+'-'+String(_n.getDate()).padStart(2,'0');
  if(_end && _end<_t){
    $('meta').innerHTML='<span style="color:#e5533c;font-weight:800">⚠ STALE SLATE — fixtures through '+_end+' (today is '+_t+'). The daily build hasn\'t refreshed.</span><br>'+_meta;
  } else {
    $('meta').textContent=_meta;
  }
  // A one-line résumé above the tabs. Preseason especially, the first thing a
  // visitor sees must be what this thing IS, not an empty-fixtures apology.
  const _agg=LG_ORDER.map(k=>d.leagues[k]).filter(Boolean);
  const _nm=_agg.reduce((s,L)=>s+(L.n_matches||0),0);
  const _btn=_agg.reduce((s,L)=>s+((L.backtest||{}).n||0),0);
  const totalFx=_agg.reduce((s,L)=>s+((L.fixtures||[]).length),0);
  // insertAdjacentHTML is absent from selftest.js's minimal DOM stub — the
  // hero is presentation, so its absence under test must not fail render().
  if(document.querySelectorAll) document.querySelectorAll('.hero-strip').forEach(e=>e.remove&&e.remove());
  if($('meta').insertAdjacentHTML) $('meta').insertAdjacentHTML('afterend',
    `<div class="verdict hero-strip" style="margin:10px 0 4px">Fitted on <b>${_nm.toLocaleString()}</b> matches
    across four leagues, xG-blended, and graded <b>walk-forward</b> on <b>${_btn.toLocaleString()}</b> of them —
    every number here is checked against what actually happened (see <b>Calibration</b>).`
    +(totalFx? '' : ` <b>Preseason:</b> the European seasons kick off mid-August — priced fixtures and legs
    appear the morning books post lines. Until then the <b>Matchup Lab</b> prices any fixture you invent,
    and each league tab holds full team ratings.`)+`</div>`);
  const tabs=[], nav=$('nav'), host=$('tabs');
  tabs.push(["scores","Scoreboard"],["legs","Legs"],["build","Builder"],["lab","Matchup Lab"],["track","Tracker"]);
  LG_ORDER.forEach(div=>{ if(d.leagues[div]) tabs.push([div, d.leagues[div].name||div]); });
  tabs.push(["props","Props"],["cal","Calibration"],["method","Method"]);
  // Preseason, the Legs tab is an apology and the Lab is the show. Open on the
  // tab that has something to say.
  const first= totalFx ? "legs" : "lab";
  nav.innerHTML=tabs.map(([k,n])=>`<button data-t="${k}" class="${k===first?'on':''}">${n}</button>`).join('');
  host.innerHTML=tabs.map(([k])=>`<section id="t-${k}" style="display:${k===first?'':'none'}"></section>`).join('');
  nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    nav.querySelectorAll('button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    tabs.forEach(([k])=>$('t-'+k).style.display=(k===b.dataset.t?'':'none'));
  });

  renderLegs(); renderBuilder(); renderLab(); renderTrack(); startScores();

  LG_ORDER.forEach(div=>{
    const L=d.leagues[div]; if(!L) return;
    const el=$('t-'+div);
    if(L.error){ el.innerHTML=`<div class="card"><div class="empty">${L.error}</div></div>`; return; }
    let fx='';
    if(L.fixtures&&L.fixtures.length){
      fx=`<table><tr><th>date</th><th>match</th><th class="num">H%</th><th class="num">D%</th><th class="num">A%</th>
      <th>shape</th><th class="num hide-m">O2.5</th><th class="num hide-m">BTTS</th><th class="num hide-m">goals</th><th class="num hide-m">mkt H/D/A</th></tr>`+
      L.fixtures.map(f=>`<tr><td class="dim">${f.date}</td>
        <td><b>${esc(f.home)}</b> v ${esc(f.away)}</td>
        <td class="num"><b>${pct(f.pH)}</b></td><td class="num dim">${pct(f.pD)}</td><td class="num">${pct(f.pA)}</td>
        <td>${trip(f.pH,f.pD,f.pA)}</td>
        <td class="num hide-m dim">${pct(f.o25)}%</td><td class="num hide-m dim">${pct(f.btts)}%</td>
        <td class="num hide-m dim" title="the model's expected goals for each side — every market on this fixture is derived from exactly these two numbers">${f.lh!=null?f.lh.toFixed(2)+'–'+f.la.toFixed(2):'—'}</td>
        <td class="num hide-m dim">${f.qH!=null?pct(f.qH)+'/'+pct(f.qD)+'/'+pct(f.qA):'—'}</td></tr>`).join('')+`</table>`;
    // Name only what is actually live. This line used to promise the Matchup Lab
    // unconditionally, which is false in any build that predates `mu` — and a
    // page that points you at a working panel and hands you an empty one is
    // worse than a page that admits the whole tab is waiting on data.
    } else fx=`<div class="empty">no upcoming fixtures priced — offseason, or books haven't posted lines. `
      + (hasMu(L) ? `Ratings, the Matchup Lab and the backtest below stay live.`
                  : `Ratings and the backtest below stay live; the Matchup Lab needs the <code>mu</code> field, which arrives with the next daily build.`)
      + `</div>`;
    let rt='';
    if(L.ratings&&L.ratings.length){
      const top=L.ratings[0].idx||1;
      rt=`<div class="ctl"><input id="find-${div}" placeholder="find a team…" style="width:190px"
            oninput="filterRatings('${div}')">
          <button class="btn" onclick="exportRatings('${div}')">⤓ ratings CSV</button></div>
      <table id="rt-${div}"><tr><th>#</th><th>team</th><th class="num">strength</th><th></th>
      <th class="num hide-m">attack</th><th class="num hide-m">defense</th></tr>`+
      L.ratings.map((r,i)=>`<tr data-team="${esc(r.team).toLowerCase()}"><td class="dim">${i+1}</td><td><b>${esc(r.team)}</b></td>
        <td class="num">${r.idx}</td><td>${bar(100*r.idx/top)}</td>
        <td class="num hide-m dim">${r.att>0?'+':''}${r.att}</td>
        <td class="num hide-m dim">${r.dfn>0?'+':''}${r.dfn}</td></tr>`).join('')+`</table>`;
    }
    const bt=L.backtest;
    const btLine = bt ? `walk-forward: model <b>${bt.acc}%</b> (Brier ${bt.brier3})`+
      (bt.market_acc!=null?` · closing market <b>${bt.market_acc}%</b> on ${bt.n_mkt} · disagreements <b>${bt.disagree_n}</b>${bt.disagree_model_right!=null?` @ model <b style="color:${bt.disagree_model_right>=50?'var(--acc2)':'var(--red)'}">${bt.disagree_model_right}%</b> right`:''}`:'')
      : 'backtest pending';
    el.innerHTML=`
      <div class="card"><h3>${esc(L.name)} — fixtures</h3>
      <div class="sub">Model 1X2 / over-2.5 / both-teams-to-score from the scoreline grid.
      Win% leads — likelihood-first, house rule. Market column is the devigged book line when posted.
      <span class="pill">${btLine}</span></div>${fx}</div>
      <div class="card"><h3>${esc(L.name)} — ratings</h3>
      <div class="sub">Time-decayed attack/defense (recent form weighted). Strength = combined index,
      100 = league average. Home advantage ${L.home_adv!=null?(Math.exp(L.home_adv)).toFixed(2)+'x goals':''}
      · fit through ${L.latest_result||''}.</div>${rt}</div>`;
  });

  renderProps(); renderCal(); renderMethod();

  // Wrap what exists now, then keep wrapping whatever any later re-render emits.
  wrapWide();
  new MutationObserver(()=>wrapWide()).observe($('tabs'),{childList:true,subtree:true});
}

/* ---------------------------------------------------------------- THE VERDICT
   The most decision-relevant fact this tool knows was buried at the bottom of
   the Method tab: on the walk-forward backtest the model is LESS accurate than
   the closing market, and when the two disagree the model is right about a
   quarter of the time. A number that damning belongs above the board, not four
   scrolls under it. It is not a reason to bin the tool -- the fixture pages are
   a calibrated read of what is likely -- it is a reason not to use it to fade
   a price. Same principle as the HR board: state the ledger before the reader
   has scrolled past a single row. */
function verdictHTML(){
  const bs=LG_ORDER.map(k=>D.leagues[k]&&D.leagues[k].backtest).filter(Boolean);
  if(!bs.length) return '';
  const n=bs.reduce((s,b)=>s+(b.n||0),0);
  const wavg=(f)=>bs.reduce((s,b)=>s+(f(b)||0)*(b.n||0),0)/Math.max(n,1);
  /* LIKE FOR LIKE. `acc` is the model over every walk-forward match; `market_acc`
     can only be over the matches that carried a closing price. Putting those two
     side by side compares the model on one match set to the market on another.
     acc_mkt is the model's rate on the market's own subset — use it when the slate
     carries it, and weight both by n_mkt so the average is over the same matches. */
  const nm=bs.reduce((s,b)=>s+(b.n_mkt||b.n||0),0);
  const wavgM=(f)=>bs.reduce((s,b)=>s+(f(b)||0)*(b.n_mkt||b.n||0),0)/Math.max(nm,1);
  const acc=bs.some(b=>b.acc_mkt!=null)?wavgM(b=>b.acc_mkt!=null?b.acc_mkt:b.acc):wavg(b=>b.acc);
  const mkt=wavgM(b=>b.market_acc);
  const dn=bs.reduce((s,b)=>s+(b.disagree_n||0),0);
  const dr=dn?bs.reduce((s,b)=>s+(b.disagree_model_right||0)*(b.disagree_n||0),0)/dn:null;
  /* THE HALF THIS BANNER WAS MISSING. It printed how often the MODEL was right on
     its disagreements with the price and never how often the MARKET was on those
     same matches. On a three-way market that is not 100 minus the model's number —
     a draw beats both — so a reader cannot derive it, and 24.8% reads as "meh"
     until 44.7% is sitting next to it. `bad` also used to trip on dr<50, which is
     arbitrary; the real test is whether the market beats the model on exactly the
     matches where the model claims to know better. */
  const dmk=(dn&&bs.some(b=>b.disagree_market_right!=null))
    ?bs.reduce((s,b)=>s+(b.disagree_market_right||0)*(b.disagree_n||0),0)/dn:null;
  const bad = dr!=null && (dmk!=null ? dmk>dr : dr<50);
  return `<div class="verdict ${bad?'bad':''}">
    Across <b>${nm.toLocaleString()}</b> walk-forward matches this model called <b>${acc.toFixed(1)}%</b>
    of results and the closing market called <b>${mkt.toFixed(1)}%</b> — same matches, both figures.
    ${dr!=null?`On the <b>${dn}</b> matches where the two picked different sides, the model was right
    <b style="color:${dr>=50?'var(--acc2)':'var(--red)'}">${dr.toFixed(1)}%</b> of the time${
      dmk!=null?` and the market was right <b>${dmk.toFixed(1)}%</b> — the market is
      <b>${(dmk/Math.max(dr,0.1)).toFixed(1)}x</b> better on precisely the matches where this model
      claims to know something the price doesn't`:''}.`:''}
    ${bad?`<br><b style="color:var(--red)">The market is the better forecaster here, and fading it with this
    model loses.</b> Use these numbers as a calibrated read of <b>what is likely</b> — which is what they
    are good at — and not as an edge over the price. Nothing on this page is claiming one.`:''}</div>`;
}

/* ------------------------------------------------------------------- LEGS
   The board this tool was missing. Every market the grid can price, on every
   priced fixture, in all four leagues, ranked by the chance it HITS.
   Explicitly NOT ranked by edge: the backtest above says the edge is not there,
   and a board sorted by a quantity the ledger has already refuted is how you
   end up with a page of long shots wearing the word "value". */
let LEGFILT={min:0.778, mkts:null};   // 0.778 = -350, the floor that matters here
function allLegs(){
  const out=[];
  LG_ORDER.forEach(div=>{
    const L=D.leagues[div]; if(!L||!L.fixtures) return;
    L.fixtures.forEach(f=>{
      if(f.lh==null||f.la==null) return;
      const g=scoreGrid(f.lh,f.la,L.rho||0);
      marketsFor(g).forEach(m=>out.push({...m,div,lg:L.name,date:f.date,home:f.home,away:f.away,
        match:f.home+' v '+f.away}));
    });
  });
  out.sort((a,b)=>b.p-a.p);
  return out;
}
function setMin(v){ LEGFILT.min=v; renderLegs(); }
window.setMin=setMin;
function renderLegs(){
  const el=$('t-legs'); if(!el) return;
  const all=allLegs();
  const rows=all.filter(r=>r.p>=LEGFILT.min);
  const steps=[[0.90,'-900'],[0.833,'-500'],[0.778,'-350'],[0.667,'-200'],[0.5,'even'],[0,'all']];
  const ctl=`<div class="ctl"><span class="dim" style="font-size:.8rem">shortest price I will take:</span>`+
    steps.map(([v,l])=>`<button class="btn ${Math.abs(LEGFILT.min-v)<1e-9?'on':''}" onclick="setMin(${v})">${l}</button>`).join('')+
    `<span class="dim" style="font-size:.8rem">${rows.length} of ${all.length} legs</span>
     <button class="btn" onclick="exportLegs()">⤓ CSV</button></div>`;
  el.innerHTML=`<div class="card"><h3>Legs — everything the model thinks is likely</h3>
    <div class="sub">Every market the scoreline grid can price, on every priced fixture, across all four
    leagues, <b>ranked by the chance it hits</b>. <b>fair</b> is that same probability written as a price —
    it is the model's number in odds form and nothing else. Compare it to your book yourself; this board
    does not rank on the gap, because the record below says the gap is not real.</div>
    ${verdictHTML()}${ctl}`+
    (rows.length?`<table><tr><th>#</th><th>bet</th><th class="hide-m">match</th><th class="hide-m">when</th>
      <th class="num">hits</th><th></th><th class="num">fair</th></tr>`+
      rows.slice(0,300).map((r,i)=>`<tr><td class="dim">${i+1}</td>
        <td><b>${esc(r.label)}</b> <span class="pill">${esc(r.lg)}</span></td>
        <td class="hide-m dim">${esc(r.match)}</td>
        <td class="hide-m dim">${esc(r.date)}</td>
        <td class="num"><b>${pc1(r.p)}%</b></td><td style="width:90px">${bar(100*r.p)}</td>
        <td class="num dim">${amFromP(r.p)}</td></tr>`).join('')+`</table>`
     +(rows.length>300?`<div class="sub" style="margin-top:8px">showing the top 300 of ${rows.length} — tighten the price floor or export the CSV for the rest.</div>`:'')
     :`<div class="empty">${all.length?`no leg is shorter than ${amFromP(LEGFILT.min)} — loosen the floor above.`
       :`no priced fixtures in this build. European leagues are between seasons; the board fills the moment fixtures post. `
        +(LG_ORDER.some(k=>hasMu(D.leagues[k])) ? `Ratings and the Matchup Lab work now.`
          : `The ratings tables work now; the Matchup Lab needs the <code>mu</code> field, which the next daily build publishes.`)}</div>`)
    +`</div>`;
}
function exportLegs(){
  const rows=allLegs().filter(r=>r.p>=LEGFILT.min)
    .map(r=>[r.date,r.lg,r.match,r.label,(100*r.p).toFixed(2),amFromP(r.p)]);
  downloadCSV('soccer_legs.csv',['date','league','match','bet','hit_pct','fair'],rows);
}
window.exportLegs=exportLegs;

/* ------------------------------------------------------------------ BUILDER
   Joint probability for a slip. The part that matters and that a naive
   calculator gets wrong: two legs on the SAME fixture are not independent.
   "over 2.5" and "both teams score" move together; "home win" and "away over
   1.5" fight each other. Multiplying their marginals can be off by a wide
   margin in either direction, and the error is always in the direction that
   flatters the slip when the legs are positively correlated.

   So same-fixture legs are evaluated jointly on that fixture's own grid --
   summing the cells where EVERY leg on that fixture is true -- and only then
   multiplied across fixtures, where independence is a fair assumption. */
let LEGS=[];
function fixtureIndex(){
  const out=[];
  LG_ORDER.forEach(div=>{const L=D.leagues[div]; if(!L||!L.fixtures) return;
    L.fixtures.forEach((f,i)=>{ if(f.lh!=null) out.push({id:div+':'+i,div,rho:L.rho||0,f,lg:L.name}); });});
  return out;
}
// A market key -> predicate on (home goals, away goals). One source of truth,
// shared by the board and the builder, so a leg can never mean two things.
function pred(key){
  const n=parseFloat(key.replace(/^[A-Z+-]*/,''));
  if(key==='H')return (i,j)=>i>j; if(key==='D')return (i,j)=>i===j; if(key==='A')return (i,j)=>i<j;
  if(key==='1X')return (i,j)=>i>=j; if(key==='X2')return (i,j)=>i<=j; if(key==='12')return (i,j)=>i!==j;
  if(key[0]==='O')return (i,j)=>i+j>n; if(key[0]==='U')return (i,j)=>i+j<n;
  if(key==='BY')return (i,j)=>i>0&&j>0; if(key==='BN')return (i,j)=>i===0||j===0;
  if(key.startsWith('HO'))return i=>i>n; if(key.startsWith('HU'))return i=>i<n;
  if(key.startsWith('AO'))return (i,j)=>j>n; if(key.startsWith('AU'))return (i,j)=>j<n;
  if(key==='CSH')return (i,j)=>j===0; if(key==='CSA')return i=>i===0;
  if(key==='WNH')return (i,j)=>i>j&&j===0; if(key==='WNA')return (i,j)=>j>i&&i===0;
  if(key==='H-1.5')return (i,j)=>i-j>=2; if(key==='A-1.5')return (i,j)=>j-i>=2;
  if(key==='H+1.5')return (i,j)=>i-j>-2; if(key==='A+1.5')return (i,j)=>j-i>-2;
  return null;
}
function slipProb(legs){
  const byFx={};
  legs.forEach(l=>{ (byFx[l.fx]=byFx[l.fx]||[]).push(l); });
  let p=1, corr=1;
  Object.keys(byFx).forEach(fx=>{
    const ls=byFx[fx], m=fixtureIndex().find(x=>x.id===fx); if(!m) return;
    const g=scoreGrid(m.f.lh,m.f.la,m.rho);
    const ps=ls.map(l=>pred(l.key)).filter(Boolean);
    const joint=gsum(g,(i,j)=>ps.every(f=>f(i,j)));
    const indep=ls.reduce((s,l)=>{const f=pred(l.key); return f?s*gsum(g,f):s;},1);
    p*=joint; corr*= indep>0 ? joint/indep : 1;
  });
  return {p,corr};
}
function renderBuilder(){
  const el=$('t-build'); if(!el) return;
  const fxs=fixtureIndex();
  if(!fxs.length){
    el.innerHTML=`<div class="card"><h3>Builder</h3><div class="sub">Price a slip with same-game
      correlation handled properly.</div>${verdictHTML()}
      <div class="empty">no priced fixtures in this build, so there is nothing to build with.
      The leagues are between seasons; this fills when fixtures post.</div></div>`; return;
  }
  const fxSel=fxs.map(m=>`<option value="${m.id}">${esc(m.f.date)} · ${esc(m.f.home)} v ${esc(m.f.away)} (${esc(m.lg)})</option>`).join('');
  const g0=scoreGrid(fxs[0].f.lh,fxs[0].f.la,fxs[0].rho);
  const mkSel=marketsFor(g0).map(m=>`<option value="${m.key}">${esc(m.label)}</option>`).join('');
  el.innerHTML=`<div class="card"><h3>Builder — price the whole slip</h3>
    <div class="sub">Legs on the <b>same fixture</b> are priced together off that match's own scoreline
    grid, so correlation is handled exactly rather than assumed away. Legs on different fixtures are
    multiplied. The <b>correlation</b> figure shows how far a naive leg-by-leg multiplication would have
    been off — above 1.00 the legs help each other, below 1.00 they fight.</div>
    ${verdictHTML()}
    <div class="ctl"><select id="bFx">${fxSel}</select><select id="bMk">${mkSel}</select>
      <button class="btn on" onclick="addLeg()">+ add leg</button>
      <button class="btn" onclick="LEGS=[];renderSlip()">clear</button></div>
    <div id="slip"></div></div>`;
  $('bFx').onchange=()=>{
    const m=fxs.find(x=>x.id===$('bFx').value); if(!m) return;
    const g=scoreGrid(m.f.lh,m.f.la,m.rho);
    $('bMk').innerHTML=marketsFor(g).map(x=>`<option value="${x.key}">${esc(x.label)}</option>`).join('');
  };
  renderSlip();
}
function addLeg(){
  const fx=$('bFx').value, key=$('bMk').value;
  const m=fixtureIndex().find(x=>x.id===fx); if(!m) return;
  const g=scoreGrid(m.f.lh,m.f.la,m.rho);
  const mk=marketsFor(g).find(x=>x.key===key); if(!mk) return;
  if(LEGS.some(l=>l.fx===fx&&l.key===key)) return;   // same leg twice is not a parlay
  LEGS.push({fx,key,label:mk.label,match:m.f.home+' v '+m.f.away,p:mk.p});
  renderSlip();
}
window.addLeg=addLeg;
function delLeg(i){ LEGS.splice(i,1); renderSlip(); }
window.delLeg=delLeg;
function renderSlip(){
  const el=$('slip'); if(!el) return;
  if(!LEGS.length){ el.innerHTML=`<div class="empty">no legs yet</div>`; return; }
  const {p,corr}=slipProb(LEGS);
  const naive=LEGS.reduce((s,l)=>s*l.p,1);
  el.innerHTML=LEGS.map((l,i)=>`<div class="legrow">
      <button class="x" onclick="delLeg(${i})" title="remove">×</button>
      <b>${esc(l.label)}</b><span class="dim">${esc(l.match)}</span>
      <span class="pill">${pc1(l.p)}% · ${amFromP(l.p)}</span></div>`).join('')
    +`<div style="margin-top:14px">
       <div class="big">${pc1(p)}% <span class="dim" style="font-size:.9rem;font-weight:400">chance this slip cashes</span></div>
       <div class="sub" style="margin-top:6px">fair price <b>${amFromP(p)}</b> ·
         ${LEGS.length} legs · correlation <b>${corr.toFixed(3)}x</b>
         <span class="dim">(naive leg-by-leg would have said ${pc1(naive)}%)</span></div>
       <div class="sub">At <b>${amFromP(p)}</b> this is break-even. Anything the book pays you
         <i>shorter</i> than that is priced against you; the model does not claim to know which side
         of that line the real number sits on — see the verdict above.</div></div>`;
}

/* --------------------------------------------------------------- MATCHUP LAB
   Any team vs any team in a league, at home, away, or neutral. This is what
   publishing `mu` bought: without a league baseline the browser has ratings but
   no way to turn two of them into goal rates, so the panel could not exist. */
/* ---- Scoreboard: the day's games, live, same feed as the World Cup tool --
   ESPN's open scoreboard (site.api.espn.com, no key, browser-side) for the
   same four leagues the model covers. Each finished/live game shows the
   score; each game whose sides map onto our ratings also shows the MODEL's
   pre-match favorite, so the scoreboard grades the model in public exactly
   like the World Cup tool does. Fails soft: feed unreachable -> a sentence,
   not a blank. */
const ESPN_LG={E0:'eng.1',SP1:'esp.1',D1:'ger.1',F1:'fra.1'};
let SCORES={state:'load',games:[]}, _scoresTimer=null;
function _normTeam(s){return String(s||'').toLowerCase().replace(/[^a-z]/g,'');}
function _findRated(L,name){
  const n=_normTeam(name); if(!n) return null;
  let best=null;
  (L.ratings||[]).forEach(r=>{const m=_normTeam(r.team);
    if(m===n||n.includes(m)||m.includes(n)){ if(!best||m.length>_normTeam(best).length) best=r.team; }});
  return best;
}
function startScores(){
  renderScores();
  try{
    Promise.all(Object.entries(ESPN_LG).map(([div,code])=>
      fetch(`https://site.api.espn.com/apis/site/v2/sports/soccer/${code}/scoreboard`)
        .then(r=>r.json()).then(j=>({div,ev:(j.events||[])})).catch(()=>({div,ev:null}))
    )).then(rs=>{
      if(rs.every(r=>r.ev===null)){ SCORES={state:'fail',games:[]}; renderScores(); return; }
      const games=[];
      rs.forEach(({div,ev})=>(ev||[]).forEach(e=>{
        try{
          const c=(e.competitions||[])[0]||{}, cs=c.competitors||[];
          const h=cs.find(x=>x.homeAway==='home'), a=cs.find(x=>x.homeAway==='away');
          if(!h||!a) return;
          const st=(((e.status||{}).type)||{});
          games.push({div, ms:Date.parse(e.date||0),
            state: st.state||'pre', clk:(e.status||{}).displayClock||'',
            home:(h.team||{}).displayName||'?', away:(a.team||{}).displayName||'?',
            hs:h.score, as:a.score,
            hWin:h.winner===true, aWin:a.winner===true});
        }catch(_){/* one bad event must not kill the board */}
      }));
      games.sort((x,y)=>x.ms-y.ms);
      SCORES={state:'ok',games}; renderScores();
    });
    if(!_scoresTimer && typeof setInterval!=='undefined')
      _scoresTimer=setInterval(()=>{ if(SCORES.state!=='load') startScores(); }, 120000);
  }catch(_){ SCORES={state:'fail',games:[]}; renderScores(); }
}
function renderScores(){
  const el=$('t-scores'); if(!el) return;
  const g=SCORES.games;
  let body;
  if(SCORES.state==='load') body=`<div class="empty">loading the day's games from the live feed…</div>`;
  else if(SCORES.state==='fail') body=`<div class="empty">Live scores unreachable from this browser right now — every other tab still works from the model's own data.</div>`;
  else if(!g.length) body=`<div class="empty">no matches on the live feed today — the leagues kick off mid-August, and this board fills itself on matchdays.</div>`;
  else body=LG_ORDER.filter(k=>g.some(x=>x.div===k)).map(k=>{
    const L=D.leagues[k]||{};
    return `<div style="margin-top:10px"><b>${esc(L.name||k)}</b><table>`+
      g.filter(x=>x.div===k).map(x=>{
        const live=x.state==='in', done=x.state==='post';
        const stat= live?`<span style="color:var(--acc2);font-weight:700">LIVE${x.clk?' '+esc(x.clk):''}</span>`
                  : done?`<span class="dim">FT</span>`
                  : `<span class="dim">${new Date(x.ms).toLocaleString([],{weekday:'short',month:'numeric',day:'numeric',hour:'numeric',minute:'2-digit'})}</span>`;
        const sc=(live||done)?`<b>${esc(x.hs)}–${esc(x.as)}</b>`:'';
        let mdl='';
        const th=_findRated(L,x.home), ta=_findRated(L,x.away);
        if(th&&ta&&th!==ta&&hasMu(L)){
          const lam=lamFor(L,th,ta,false);
          if(lam){ const gr=scoreGrid(lam.lh,lam.la,L.rho||0);
            let pH=0,pD=0,pA=0;
            for(let i=0;i<gr.length;i++)for(let j=0;j<gr[i].length;j++){const p=gr[i][j];i>j?pH+=p:i<j?pA+=p:pD+=p;}
            const fav=pH>=pA?x.home:x.away, fp=Math.max(pH,pA);
            let note=`model: <b>${esc(fav)}</b> ${pct(fp)}%`;
            if(done){ const won=(pH>=pA&&x.hWin)||(pA>pH&&x.aWin); const draw=!x.hWin&&!x.aWin;
              note+= draw?` <span class="dim">(draw — nobody right)</span>`
                   : won?` <span style="color:var(--acc2)">✓</span>`:` <span style="color:var(--red)">✗</span>`; }
            mdl=`<span class="dim" style="font-size:.78rem">${note}</span>`;
          }
        }
        const clk=(th&&ta&&th!==ta)?` data-lab-lg="${k}" data-lab-h="${esc(th)}" data-lab-a="${esc(ta)}"
          style="cursor:pointer" title="Open in Matchup Lab →"`:'';
        return `<tr${clk} ${done&&!live?'class="dim"':''}><td>${stat}</td>
          <td><b style="${x.hWin?'color:var(--acc2)':''}">${esc(x.home)}</b> <span class="dim">v</span>
              <b style="${x.aWin?'color:var(--acc2)':''}">${esc(x.away)}</b>${th&&ta?' <span class="dim" style="font-size:.72rem">↗ lab</span>':''}</td>
          <td class="num">${sc}</td><td class="hide-m">${mdl}</td></tr>`;
      }).join('')+`</table></div>`;
  }).join('');
  el.innerHTML=`<div class="card"><h3>Scoreboard — the day's games, live</h3>
    <div class="sub">Same live feed as the World Cup tool (ESPN's open scoreboard), auto-refreshing
    every 2 minutes. Where both clubs map onto the model's ratings the pre-match favorite prints
    beside the score — <b>and gets graded ✓/✗ in public when the whistle goes</b>.
    Click any matchup to open it in the Matchup Lab.</div>${body}</div>`;
  el.querySelectorAll&&el.querySelectorAll('[data-lab-h]').forEach(r=>r.addEventListener&&r.addEventListener('click',()=>gotoLab(r.dataset.labLg,r.dataset.labH,r.dataset.labA)));
}
/* Scoreboard row -> Matchup Lab with that fixture loaded, same as the World
   Cup tool. Order matters: switching the league rebuilds both team selects. */
function gotoLab(div,h,a){
  const b=document.querySelector&&document.querySelector('#nav button[data-t="lab"]');
  if(b&&b.click) b.click();
  const lg=$('labLg'); if(!lg) return;
  lg.value=div; if(lg.onchange) lg.onchange();
  if($('labH')) $('labH').value=h;
  if($('labA')) $('labA').value=a;
  labDraw();
}
/* ---- Bet Tracker: a written-down record beats a remembered one. ----------
   Stored in THIS browser (localStorage) — private, survives visits, never
   uploaded. Grading is manual (W/L/push) because honesty needs a human to
   admit the loss; the running line does the arithmetic that memory fudges. */
function bets(){ try{ return JSON.parse(localStorage.getItem('socBets')||'[]'); }catch(e){ return []; } }
function saveBets(b){ try{ localStorage.setItem('socBets', JSON.stringify(b)); }catch(e){} }
function decFromAm(a){ a=Number(a); if(!a||!isFinite(a)) return null; return a>0?1+a/100:1+100/(-a); }
function addBet(){
  const lab=$('tkLab').value.trim(), am=Number($('tkAm').value), st=Number($('tkSt').value)||0;
  if(!lab||!decFromAm(am)){ $('tkMsg').textContent='need a bet and a real American price (e.g. -350)'; return; }
  const b=bets(); b.unshift({d:new Date().toISOString().slice(0,10),lab,am,st,r:''});
  saveBets(b); renderTrack();
}
function setBet(i,r){ const b=bets(); if(b[i]){ b[i].r=(b[i].r===r?'':r); saveBets(b); renderTrack(); } }
function delBet(i){ const b=bets(); b.splice(i,1); saveBets(b); renderTrack(); }
function exportBets(){
  downloadCSV('soccer_bets.csv',['date','bet','price','stake','result'],
    bets().map(b=>[b.d,b.lab,b.am,b.st,b.r||'open']));
}
function renderTrack(){
  const el=$('t-track'); if(!el) return;
  const b=bets();
  const done=b.filter(x=>x.r==='W'||x.r==='L');
  const w=done.filter(x=>x.r==='W');
  const staked=done.reduce((s,x)=>s+(x.st||0),0);
  const pl=done.reduce((s,x)=>s+(x.r==='W'?(x.st||0)*(decFromAm(x.am)-1):-(x.st||0)),0);
  const sum= done.length?`<div class="verdict">record <b>${w.length}-${done.length-w.length}</b>
      (${(100*w.length/done.length).toFixed(0)}% of graded) · staked <b>$${staked.toFixed(0)}</b> ·
      P/L <b style="color:${pl>=0?'var(--acc2)':'var(--red)'}">${pl>=0?'+':''}$${pl.toFixed(2)}</b>
      ${staked?` · ROI <b style="color:${pl>=0?'var(--acc2)':'var(--red)'}">${(100*pl/staked).toFixed(1)}%</b>`:''}
      — the number memory won't keep.</div>`
    :`<div class="sub">No graded bets yet. Log a bet when you place it, grade it when it settles —
      the running record and ROI appear here and do not forget.</div>`;
  el.innerHTML=`<div class="card"><h3>Bet Tracker — your record, written down</h3>
    <div class="sub">Lives in this browser only. Log the bet when you place it (copy a leg's label from
    any tab), then hit <b>W</b> or <b>L</b> when it settles. A tracked record is the only defensible
    answer to "how am I actually doing?"</div>${sum}
    <div class="ctl"><input id="tkLab" placeholder="bet — e.g. Arsenal ML v Leeds" style="flex:2;min-width:180px">
      <input id="tkAm" placeholder="price (-350)" style="width:95px"><input id="tkSt" placeholder="stake $" style="width:80px">
      <button class="btn" onclick="addBet()">＋ log bet</button>
      ${b.length?`<button class="btn" onclick="exportBets()">⤓ CSV</button>`:''}<span id="tkMsg" class="dim"></span></div>`
    +(b.length?`<table><tr><th>date</th><th>bet</th><th class="num">price</th><th class="num hide-m">stake</th><th>result</th><th></th></tr>`+
      b.map((x,i)=>`<tr style="${x.r==='W'?'':x.r==='L'?'opacity:.65':''}"><td class="dim">${esc(x.d)}</td>
        <td><b>${esc(x.lab)}</b></td><td class="num">${x.am>0?'+':''}${x.am}</td>
        <td class="num hide-m">${x.st?'$'+x.st:''}</td>
        <td><button class="btn ${x.r==='W'?'on':''}" onclick="setBet(${i},'W')">W</button>
            <button class="btn ${x.r==='L'?'on':''}" onclick="setBet(${i},'L')">L</button>
            <button class="btn ${x.r==='P'?'on':''}" title="push / void" onclick="setBet(${i},'P')">push</button></td>
        <td><button class="x" title="delete" onclick="delBet(${i})">×</button></td></tr>`).join('')+`</table>`:'')
    +`</div>`;
}
function renderLab(){
  const el=$('t-lab'); if(!el) return;
  const avail=LG_ORDER.filter(k=>D.leagues[k]&&(D.leagues[k].ratings||[]).length);
  if(!avail.length){ el.innerHTML=`<div class="card"><div class="empty">no ratings yet</div></div>`; return; }
  const withMu=avail.filter(k=>hasMu(D.leagues[k]));
  if(!withMu.length){
    el.innerHTML=`<div class="card"><h3>Matchup Lab</h3>${verdictHTML()}
      <div class="empty">This build predates the <code>mu</code> field (the league's baseline goal rate),
      and without it two ratings cannot be turned into goal rates. Rather than invent a baseline and draw a
      confident-looking grid on top of it, the Lab waits: the daily build publishes <code>mu</code> from
      tomorrow and this panel comes to life on its own.</div></div>`; return;
  }
  const div=withMu[0], L=D.leagues[div];
  const opt=k=>(D.leagues[k].ratings||[]).map(r=>`<option>${esc(r.team)}</option>`).join('');
  el.innerHTML=`<div class="card"><h3>Matchup Lab — any two teams</h3>
    <div class="sub">Puts any two sides in a league against each other and prices the full scoreline
    distribution — the same grid the fixture pages use, on a fixture that does not exist yet.
    Every market below is one sum over that grid.</div>
    ${verdictHTML()}
    <div class="ctl">
      <select id="labLg">${withMu.map(k=>`<option value="${k}">${esc(D.leagues[k].name)}</option>`).join('')}</select>
      <select id="labH">${opt(div)}</select><span class="dim">v</span><select id="labA">${opt(div)}</select>
      <button class="btn" id="labN">neutral ground</button></div>
    <div id="labOut"></div></div>`;
  $('labLg').onchange=()=>{
    const k=$('labLg').value;
    $('labH').innerHTML=opt(k); $('labA').innerHTML=opt(k);
    const rs=D.leagues[k].ratings||[]; if(rs[1]) $('labA').value=rs[1].team;
    labDraw();
  };
  $('labH').onchange=$('labA').onchange=labDraw;
  $('labN').onclick=()=>{ $('labN').classList.toggle('on'); labDraw(); };
  if((L.ratings||[])[1]) $('labA').value=L.ratings[1].team;
  labDraw();
}
function labDraw(){
  const out=$('labOut'); if(!out) return;
  // The select can miss (harness DOM has no default value; a league could be
  // absent from a hand-edited slate). A miss must be a stated condition, not a
  // crash that takes the whole render() down with it.
  const L=D.leagues[$('labLg').value] || D.leagues[LG_ORDER.find(k=>D.leagues[k]&&hasMu(D.leagues[k]))];
  if(!L){ out.innerHTML=`<div class="empty">no league with a baseline goal rate in this build</div>`; return; }
  const lam=lamFor(L,$('labH').value,$('labA').value,$('labN').classList.contains('on'));
  if(!lam){ out.innerHTML=`<div class="empty">pick two different teams</div>`; return; }
  const g=scoreGrid(lam.lh,lam.la,L.rho||0), M=marketsFor(g).sort((a,b)=>b.p-a.p);
  // correct-score map, capped at 5 because the tail below 0.5% is visual noise
  let hm=`<table class="grid"><tr><th class="dim">H \\ A</th>`;
  for(let j=0;j<=5;j++) hm+=`<th class="dim">${j}</th>`; hm+='</tr>';
  let best=0; for(let i=0;i<=5;i++) for(let j=0;j<=5;j++) best=Math.max(best,g[i][j]);
  for(let i=0;i<=5;i++){ hm+=`<tr><th class="dim">${i}</th>`;
    for(let j=0;j<=5;j++){ const v=g[i][j], a=Math.min(v/best,1);
      hm+=`<td style="background:rgba(74,214,162,${(0.06+0.62*a).toFixed(3)});color:${a>0.5?'#08120d':'var(--txt)'}"
        title="${i}–${j} · fair ${amFromP(v)}">${(100*v).toFixed(1)}</td>`; }
    hm+='</tr>'; }
  hm+='</table>';
  const top=[...Array(6).keys()].flatMap(i=>[...Array(6).keys()].map(j=>({i,j,p:g[i][j]})))
    .sort((a,b)=>b.p-a.p).slice(0,3).map(s=>`<b>${s.i}–${s.j}</b> ${pc1(s.p)}%`).join(' · ');
  out.innerHTML=`<div class="sub" style="margin-top:10px">expected goals
      <b>${lam.lh.toFixed(2)}</b> – <b>${lam.la.toFixed(2)}</b> ·
      most likely scores ${top}
      <span class="dim" title="${lam.exact
        ? 'These two are actually playing, so the Lab is using the exact goal rates the publisher computed for that fixture — this panel and the league fixture table will agree to the decimal.'
        : 'This fixture is not on the schedule, so the rates are rebuilt from the league baseline and the two teams ratings. Same formula the publisher uses; the published ratings are rounded to 3dp, so expect drift on the order of 0.1%.'}">·
      ${lam.exact?'scheduled fixture — publisher rates':'hypothetical — rebuilt from ratings'}</span></div>
    <div style="display:flex;gap:22px;flex-wrap:wrap;align-items:flex-start">
      <div><div class="sub">correct score %</div>${hm}</div>
      <div style="flex:1;min-width:280px"><div class="sub">every market, most likely first</div>
      <table>${M.map(m=>`<tr><td>${esc(m.label)}</td><td class="num"><b>${pc1(m.p)}%</b></td>
        <td style="width:80px">${bar(100*m.p)}</td><td class="num dim">${amFromP(m.p)}</td></tr>`).join('')}</table></div></div>`;
}

function filterRatings(div){
  const q=($('find-'+div).value||'').toLowerCase().trim();
  $('rt-'+div).querySelectorAll('tr[data-team]').forEach(tr=>{
    tr.style.display = !q || tr.dataset.team.includes(q) ? '' : 'none'; });
}
window.filterRatings=filterRatings;
function exportRatings(div){
  const L=D.leagues[div];
  downloadCSV(div+'_ratings.csv',['rank','team','strength','attack','defense'],
    (L.ratings||[]).map((r,i)=>[i+1,r.team,r.idx,r.att,r.dfn]));
}
window.exportRatings=exportRatings;

function renderProps(){
  const d=D, props=[];
  LG_ORDER.forEach(div=>{
    const L=d.leagues[div]; if(!L||!L.fixtures) return;
    L.fixtures.forEach(f=>{
      if(!f.scorers) return;
      (f.scorers.home||[]).forEach(s=>props.push({p:s.p,name:s.name,team:f.home,opp:f.away,ha:'H',date:f.date,lg:L.name}));
      (f.scorers.away||[]).forEach(s=>props.push({p:s.p,name:s.name,team:f.away,opp:f.home,ha:'A',date:f.date,lg:L.name}));
    });
  });
  props.sort((a,b)=>b.p-a.p);
  $('t-props').innerHTML=`<div class="card"><h3>Anytime Goalscorer — model board</h3>
  <div class="sub">P(scores) = team goal rate (Dixon-Coles) x player's blended goal/xG share x availability —
  a MODEL read, logged for grading, not a market price. Likelihood-first, all four leagues together.
  <b>Compare to your book's price; the gap is yours to judge.</b>${d.props_src?`<br><span class="pill">shares: ${esc(d.props_src)}</span>`:''}</div>`+
  (props.length?`<table><tr><th>#</th><th>player</th><th class="hide-m">match</th><th class="num">anytime%</th><th></th><th class="num">fair</th></tr>`+
  props.slice(0,60).map((r,i)=>`<tr><td class="dim">${i+1}</td>
  <td><b>${esc(r.name)}</b> <span class="pill">${esc(r.team)}</span><span class="dim hide-m"> ${esc(r.lg)}</span></td>
  <td class="hide-m dim">${r.ha==='H'?'v':'@'} ${esc(r.opp)} · ${esc(r.date)}</td>
  <td class="num"><b>${pct(r.p)}%</b></td><td>${bar(r.p*140)}</td>
  <td class="num dim">${amFromP(r.p)}</td></tr>`).join('')+`</table>`
  :`<div class="empty">${propsEmptyReason(d)}</div>`+propsPreviewHTML(d))+`</div>`;
}
/* Preseason: no fixtures means no anytime board, but the SHARES themselves are
   live data worth showing — who actually scores each club's goals, from ~2,200
   understat player-seasons. Renders only when the board above is empty. */
function propsPreviewHTML(d){
  const pv=d.props_preview||{}; const divs=LG_ORDER.filter(k=>(pv[k]||[]).length);
  if(!divs.length) return '';
  return `<div class="sub" style="margin-top:14px"><b>Meanwhile, the shares behind that board are live.</b>
    Each league's most concentrated scorers — the share of their club's goals they account for
    (goals blended with xG). When a fixture posts, these shares × the match's goal rate become the board above.</div>`
    +divs.map(k=>`<div style="margin-top:10px"><b>${esc((d.leagues[k]||{}).name||k)}</b>
      <table><tr><th>player</th><th class="hide-m">club</th><th class="num">share of club goals</th><th></th></tr>`+
      pv[k].map(r=>`<tr><td><b>${esc(r.name)}</b></td><td class="hide-m dim">${esc(r.team)}</td>
        <td class="num"><b>${pc1(r.share)}%</b></td><td style="width:110px">${bar(100*r.share*2.2)}</td></tr>`).join('')
      +`</table></div>`).join('');
}

/* An empty Props tab has two completely different causes and used to give one
   message for both: "no fixtures carry player shares yet — appears once fixtures
   post and the props source responds." That reads as an offseason notice, so a
   BROKEN player feed looked like a quiet calendar. props_src carries the truth
   (it read "E0:off(ValueError) · SP1:off(...) · ..." for weeks); use it. */
function propsEmptyReason(d){
  const src = d.props_src || '';
  const parts = src ? src.split('·').map(s=>s.trim()).filter(Boolean) : [];
  const off   = parts.filter(s=>s.includes(':off('));
  let fixtures = 0;
  LG_ORDER.forEach(div=>{ const L=d.leagues[div]; if(L&&L.fixtures) fixtures+=L.fixtures.length; });
  if(parts.length && off.length === parts.length)
    return 'the player-shares source is DOWN in all '+off.length+' leagues, so there are no '
         + 'props to show. This is a broken feed, not an empty calendar. ('+esc(src)+')';
  if(off.length)
    return off.length+' of '+parts.length+' leagues have no player shares ('+esc(off.join(', '))
         + '); the rest post props once their fixtures do.';
  if(!fixtures)
    return 'no fixtures on the board yet — props appear as soon as the next round posts.';
  return 'fixtures are posted but none carry player shares yet.';
}

function renderCal(){
  const d=D, c=d.cal||{};
  let ch='';
  if(c.n>0){
    ch=`<div class="sub">graded matches: <b>${c.n}</b> · model accuracy <b>${c.acc}%</b> · 3-way Brier <b>${c.brier3}</b></div>`;
    /* The live grader had the same asymmetry the backtest did: it printed the
       model's rate on its disagreements with the price and never the market's on
       the same matches. Also `c.acc` is over every graded row while `m.acc` is over
       the priced subset — m.model_acc is the like-for-like figure. */
    if(c.market){const m=c.market;
      ch+=`<div class="sub">vs closing market (live continuation), on the <b>${m.n}</b> graded matches that
      carried a closing price: model <b>${m.model_acc!=null?m.model_acc:c.acc}%</b> · market <b>${m.acc}%</b> ·
      disagreements <b>${m.disagree_n}</b>${m.disagree_model_right!=null?` · model right <b style="color:${m.disagree_model_right>=50?'var(--acc2)':'var(--red)'}">${m.disagree_model_right}%</b>`:''}${
      m.disagree_market_right!=null?` · market right <b>${m.disagree_market_right}%</b>`:''}</div>`;
      if(m.disagree_market_right!=null&&m.disagree_model_right!=null)
        ch+=`<div class="sub dim">These two do not sum to 100: a three-way market has a third outcome both
        can miss, so neither rate can be derived from the other and both are counted.</div>`;}
    if(c.by_league){
      ch+=`<table><tr><th>league</th><th class="num">n</th><th class="num">acc</th><th class="num">brier</th><th class="num hide-m">mkt acc</th><th class="num hide-m">disagree (model / market right)</th></tr>`+
      Object.entries(c.by_league).map(([k,b])=>`<tr><td><b>${esc((d.leagues[k]||{}).name||k)}</b></td>
      <td class="num">${b.n}</td><td class="num">${b.acc}%</td><td class="num">${b.brier3}</td>
      <td class="num hide-m dim">${b.market?b.market.acc+'%':'—'}</td>
      <td class="num hide-m dim">${b.market?b.market.disagree_n+(b.market.disagree_model_right!=null?' ('+b.market.disagree_model_right+'% / '+(b.market.disagree_market_right!=null?b.market.disagree_market_right+'%':'—')+')':''):'—'}</td></tr>`).join('')+`</table>`;
    }
  } else ch=`<div class="empty">grading begins once published fixtures play out — every logged probability settles against the final result automatically.</div>`;
  $('t-cal').innerHTML=`<div class="card"><h3>Calibration — the model, graded</h3>
  <div class="sub">Every published match probability is logged pre-match and settled from the same
  result files the model trains on. Includes a LIVE continuation of the disagreement study:
  when this model and the closing market pick different sides, who wins?</div>${verdictHTML()}${ch}</div>`;
}

function renderMethod(){
  const d=D;
  const btAll=LG_ORDER.filter(k=>d.leagues[k]&&d.leagues[k].backtest).map(k=>{
    const b=d.leagues[k].backtest;
    const t=b.totals;
    return `<tr><td><b>${esc(d.leagues[k].name)}</b></td><td class="num">${b.n}</td><td class="num">${b.acc}%</td>
    <td class="num">${b.brier3}</td><td class="num">${b.market_acc!=null?b.market_acc+'%':'—'}</td>
    <td class="num">${b.disagree_n!=null?b.disagree_n:'—'}</td>
    <td class="num">${b.disagree_model_right!=null?`<b style="color:${b.disagree_model_right>=50?'var(--acc2)':'var(--red)'}">${b.disagree_model_right}%</b>`:'—'}</td>
    <td class="num dim">${b.disagree_market_right!=null?b.disagree_market_right+'%':'—'}</td></tr>`+
    (t?`<tr><td class="dim" style="padding-left:18px">↳ over/under 2.5</td><td class="num dim">${t.n}</td><td class="num dim">${t.acc}%</td><td class="num dim">—</td><td class="num dim">${t.market_acc}%</td><td class="num dim">${t.disagree_n}</td><td class="num dim">${t.disagree_model_right!=null?t.disagree_model_right+'%':'—'}</td><td class="num dim">${t.disagree_market_right!=null?t.disagree_market_right+'%':'—'}</td></tr>`:'');
  }).join('');
  /* Aggregate the disagreement rows across leagues. Per-league the numbers read as
     four separate mediocre results; summed they are one unambiguous statement, and
     that statement is the answer to "is this model worth betting". */
  const _bs = LG_ORDER.filter(k=>d.leagues[k]&&d.leagues[k].backtest).map(k=>d.leagues[k].backtest);
  const _dn = _bs.reduce((s,b)=>s+(b.disagree_n||0),0);
  const _dmod = _dn?_bs.reduce((s,b)=>s+(b.disagree_model_right||0)*(b.disagree_n||0),0)/_dn:null;
  const _dmkt = _dn&&_bs.some(b=>b.disagree_market_right!=null)
    ?_bs.reduce((s,b)=>s+(b.disagree_market_right||0)*(b.disagree_n||0),0)/_dn:null;
  $('t-method').innerHTML=`<div class="card"><h3>Method — and the honest verdict</h3>
  <div class="sub" style="font-size:.86rem;line-height:1.65">
  <b>Model:</b> Dixon-Coles — independent Poisson goals with team attack/defense strengths, home
  advantage, and the low-score dependence correction (rho). Matches time-decayed (half-life
  ~8 months) so recent form counts more. Fit by maximum likelihood per league; the full scoreline
  grid prices 1X2, over/under 2.5 and BTTS from one distribution.<br><br>
  <b>Where the numbers on the other tabs come from:</b> the publisher emits two goal rates per fixture
  (<code>lh</code>, <code>la</code>), the league baseline (<code>mu</code>), home advantage and rho.
  The Legs board, the Builder and the Matchup Lab rebuild the same ${KMAX+1}x${KMAX+1} scoreline grid in
  your browser and sum it over different regions — they are not a second model, they are the same
  distribution asked different questions. Same kmax, same tau, same renormalisation as the Python.<br><br>
  <b>The measured verdict, per league</b> (walk-forward, expanding window, refit monthly,
  model vs the CLOSING market on identical matches — recomputed weekly from raw data):<br><br>
  ${btAll?`<table><tr><th>league</th><th class="num">n</th><th class="num">model</th><th class="num">brier</th><th class="num">market</th><th class="num">disagree</th><th class="num">model right</th><th class="num">market right</th></tr>${btAll}</table>`:'<span class="dim">backtests pending first full run</span>'}
  ${_dmkt!=null?`<br><div class="card" style="border-color:var(--red);background:rgba(224,108,117,.07)">
  <b>Read this before you take a soccer leg off this board.</b><br>
  Across all four leagues the model picks a different 1X2 side than the closing market on
  <b>${_dn}</b> of ${_bs.reduce((s,b)=>s+(b.n_mkt||b.n||0),0)} walk-forward matches. On those
  <b>${_dn}</b> matches the model is right <b style="color:var(--red)">${_dmod.toFixed(1)}%</b>
  of the time and the closing market is right <b>${_dmkt.toFixed(1)}%</b> of the time — the market
  is roughly <b>${(_dmkt/_dmod).toFixed(1)}x</b> better on precisely the matches where this model
  claims to know something the price doesn't.<br><br>
  These two rates do not sum to 100 because a three-way market has a third outcome both can miss,
  so neither number can be derived from the other; both are measured. The conclusion is not
  "shade the edges" — it is that <b>a disagreement with the price is evidence against the model,
  not for it</b>. Where model and market agree the model is fine; the agreements are the whole of
  its accuracy. This board is worth using to price a side you already like, and is worth nothing
  as a source of plays the market has mispriced.</div>`:''}
  <br>If the disagreement column sits under 50%, fading the market with this model loses money —
  measured, not inferred. Win% is decision support; the tool never claims an edge the table doesn't show.</div></div>`;
}

/* no-store. The daily Action republishes data/slate.json at the same URL every
   morning, so a browser is free to serve yesterday's fixtures on a page whose whole
   value is that it is today's -- and nothing would look wrong, because a stale slate
   renders perfectly. */
fetch('data/slate.json',{cache:'no-store'}).then(r=>r.json()).then(render)
 .catch(()=>{$('meta').textContent='could not load slate.json — run soccer_publish.py (or wait for the daily Action)';});
</script></body></html>
